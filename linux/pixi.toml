[workspace]
authors = ["Mike Smyth <Mike.M.Smyth@jpl.nasa.gov>"]
channels = ["conda-forge", "fake-muses-conda-channel"]
name = "muses-env-pixi"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "*"
conda = "*"
pip = "*"
wheel = "*"
setuptools = "*"
# Not positive we want this. It pulls in a lot of packages, but this
# is what is needed to build framework. Being able to build
# framework isn't a strict requirement, we could install with just
# the framework package. But at least for now assume we want all
# these tools all the time.
refractor-development-tools = "*"
# Make sure we get the mpich version rather than openmpi. amuse-me depends on
# the arguments mpich has
mpi = { version = "*", build = "mpich" }
# Needed by pip packages as dependencies, go ahead and install as conda
# packages. Note you can inspect pixi info to find
# out what should get added to this list
six = "*"
configobj = "*"
defusedxml = "*"
requests = "*"
owslib = "*"
cffi = "*"
pycparser = "*"
appdirs = "*"
pyhdf = "*"
doxygen = "*"
# Useful tools, not a strict requirement
ruff = "*"
mypy = "*"
scipy-stubs = "*"
pandas-stubs = "*"
types-pytz = "*"
