[pypi-dependencies]
woudc-extcsv = "*"
# needed for ML. Note that there are conda packages for these, but we
# have trouble installing in the older tropess SCF machines. The packages
# require "_x86_64-microarch-level >=3", which is a way to selecting cpu
# features. I'm thinking the SCF machines have too old a cpu for this. The
# pip packages do install ok. There are a number of packages that these need,
# we can install these automatically with pip but generally we are better getting
# conda packages. See above where we grab what was needed here.
tensorflow = "*"
tensorflow_probability = "*"
tf_keras = "*"
torch = "*"
torchviz = "*"
