about:
  summary: A number of the muses python libraries
  license: LicenseRef-UNLICENSED
  description: |
    Most of the amuse-me pipeline is code that doesn't change much.
    We have one package just to install this easily. This is everything
    *except* refractor-framework, refractor-muses, and py-retrieve. This
    other packages get updated at a different cadence, so we treat those
    as separate.

